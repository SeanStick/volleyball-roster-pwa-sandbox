<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="vb-grad-large" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B35" />
      <stop offset="40%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Rounded Squircle Background -->
  <rect width="512" height="512" rx="110" fill="url(#bg-grad)" />
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="url(#vb-grad-large)" stroke-width="6" opacity="0.6" />

  <!-- Ball Circle Outer Glow -->
  <circle cx="256" cy="256" r="170" fill="#1E293B" stroke="url(#vb-grad-large)" stroke-width="12" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="170" fill="#111827" stroke="url(#vb-grad-large)" stroke-width="10"/>

  <!-- Volleyball Panels & Ribbons -->
  <path d="M256 86 C256 180 332 256 426 256" fill="none" stroke="url(#vb-grad-large)" stroke-width="12" stroke-linecap="round"/>
  <path d="M256 86 C256 180 180 256 86 256" fill="none" stroke="url(#vb-grad-large)" stroke-width="12" stroke-linecap="round"/>
  <path d="M256 426 C256 332 332 256 426 256" fill="none" stroke="url(#vb-grad-large)" stroke-width="12" stroke-linecap="round"/>
  <path d="M256 426 C256 332 180 256 86 256" fill="none" stroke="url(#vb-grad-large)" stroke-width="12" stroke-linecap="round"/>

  <!-- Dynamic Energy Lines -->
  <path d="M120 180 Q256 210 392 180" fill="none" stroke="#FF6B35" stroke-width="6" opacity="0.8"/>
  <path d="M120 332 Q256 302 392 332" fill="none" stroke="#3B82F6" stroke-width="6" opacity="0.8"/>

  <!-- Center Badge -->
  <circle cx="256" cy="256" r="44" fill="#0F172A" stroke="#F59E0B" stroke-width="6"/>
  <text x="256" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="900" fill="#FFFFFF" text-anchor="middle">V</text>
</svg>
